# Publica NIKOLAI (public/), la app de la novia (novia/web → /novia/) y la tienda George (george/ → /george/) en GitHub Pages.
# Requisito único: Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [claude/jarvis-ai-gesture-control-xo5opm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # NIKOLAI en la raíz y la app de la novia (independiente) en /novia/.
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r public/. _site/
          mkdir _site/novia
          cp -r novia/web/. _site/novia/
          mkdir _site/george
          cp -r george/. _site/george/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
