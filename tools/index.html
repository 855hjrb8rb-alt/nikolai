<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikolai Lab · Herramientas</title>
<meta name="description" content="Más de 30 herramientas online gratis: texto, desarrollo, seguridad, color, imagen y cálculo. Todo funciona en tu navegador, sin subir nada.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="qrcode.js"></script>
<style>
:root{
  --bg:#f6f7fb; --bg2:#ffffff; --card:#ffffff; --line:#e4e7ef; --text:#141826; --muted:#5d6478;
  --accent:#6d4aff; --accent2:#00b8d9; --accent-soft:rgba(109,74,255,.1); --ok:#12a150; --bad:#e5484d; --warn:#e8a317;
  --shadow:0 1px 2px rgba(20,24,38,.04),0 8px 24px rgba(20,24,38,.06);
  --r:16px; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d14; --bg2:#11141d; --card:#151925; --line:#252b3b; --text:#eef0f7; --muted:#9097ad;
  --accent:#8b6dff; --accent2:#22d3ee; --accent-soft:rgba(139,109,255,.16); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0b0d14; --bg2:#11141d; --card:#151925; --line:#252b3b; --text:#eef0f7; --muted:#9097ad;
  --accent:#8b6dff; --accent2:#22d3ee; --accent-soft:rgba(139,109,255,.16); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;text-decoration:none;font-size:17px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px;box-shadow:0 4px 14px var(--accent-soft)}
.searchbtn{flex:1;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);color:var(--muted);cursor:pointer;text-align:left}
.searchbtn span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
kbd{font:600 11px var(--mono);padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted)}
.iconbtn{width:40px;height:40px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:grid;place-items:center;font-size:17px}
.iconbtn:hover,.searchbtn:hover{border-color:var(--accent)}

/* hero */
.hero{padding:56px 0 26px;text-align:center}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.05;letter-spacing:-.04em;margin:18px auto 14px;max-width:820px}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:clamp(15px,2.2vw,18px);max-width:640px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:14px}
.stats b{display:block;color:var(--text);font-size:22px;letter-spacing:-.02em}
.filter{position:relative;max-width:620px;margin:30px auto 0}
.filter input{width:100%;height:54px;border-radius:15px;border:1px solid var(--line);background:var(--card);padding:0 18px 0 48px;font-size:16px;box-shadow:var(--shadow);outline:none}
.filter input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.filter::before{content:"⌕";position:absolute;left:18px;top:50%;transform:translateY(-52%);font-size:22px;color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:22px 0 6px;scrollbar-width:none;justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip small{opacity:.6;margin-left:4px}

/* grid */
.section-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px;font-size:20px;letter-spacing:-.02em}
.section-title small{color:var(--muted);font-weight:500;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:var(--shadow)}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--accent-soft)}
.card h3{margin:0 0 3px;font-size:15.5px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.fav{position:absolute;top:10px;right:10px;border:0;background:none;cursor:pointer;font-size:16px;opacity:.35;padding:4px}
.fav.on,.card:hover .fav{opacity:1}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* tool view */
.tool{padding:26px 0 60px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent)}
.tool-head{display:flex;gap:16px;align-items:center;margin:16px 0 22px}
.tool-head .ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:27px;background:var(--accent-soft);flex:none}
.tool-head h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.03em;line-height:1.1}
.tool-head p{margin:4px 0 0;color:var(--muted)}
.tool-head .fav{position:static;font-size:22px;margin-left:auto;opacity:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:14px}
.cols>.panel{margin-top:0!important}
.cols+.panel,.panel+.cols{margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex:1;min-width:140px}
textarea,input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:10px 12px;outline:none;font-size:15px}
textarea{min-height:180px;resize:vertical;font-family:var(--mono);font-size:13.5px;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(1.08)}
.out{font-family:var(--mono);font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;word-break:break-all;white-space:pre-wrap;min-height:46px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.msg{font-size:13.5px;font-weight:600;margin-top:8px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:34px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.sw{height:78px;border-radius:12px;display:flex;align-items:flex-end;padding:7px;font:600 12px var(--mono);cursor:pointer;border:1px solid var(--line)}
.diff{font-family:var(--mono);font-size:13.5px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px;overflow:auto;max-height:480px}
.diff div{white-space:pre-wrap;padding:1px 8px;border-radius:5px}
.diff .a{background:rgba(18,161,80,.14)}.diff .d{background:rgba(229,72,77,.14);text-decoration:line-through;text-decoration-color:rgba(229,72,77,.5)}
mark{background:rgba(232,163,23,.35);color:inherit;border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.t td:last-child{font-family:var(--mono);word-break:break-all}
table.t td{overflow-wrap:anywhere}
.big{font:700 clamp(40px,10vw,84px)/1 var(--mono);text-align:center;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:18px 0}
.related{margin-top:34px}

/* palette modal */
.cmdk{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.cmdk.open{display:flex}
.cmdk .box{width:100%;max-width:580px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;height:58px;padding:0 20px;font-size:17px;outline:none}
.cmdk ul{list-style:none;margin:0;padding:8px;max-height:56vh;overflow:auto}
.cmdk li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:11px;cursor:pointer}
.cmdk li.sel{background:var(--accent-soft)}
.cmdk li em{font-style:normal;font-size:20px;width:28px;text-align:center}
.cmdk li small{display:block;color:var(--muted);font-size:12.5px}
.cmdk .foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13.5px;text-align:center;margin-top:40px}
@media (max-width:560px){.stats{gap:16px}.stats>div{flex:1 1 40%}.searchbtn kbd{display:none}.hero{padding-top:36px}.logo b{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/"><i>⚛</i><b>Nikolai Lab</b></a>
  <button class="searchbtn" id="openCmd" aria-label="Buscar herramienta"><span>⌕ Buscar herramienta…</span><kbd>Ctrl K</kbd></button>
  <button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button>
</div></header>

<main id="app" class="wrap"></main>

<footer><div class="wrap">Nikolai Lab · Todas las herramientas funcionan 100 % en tu navegador. Tus datos nunca salen de tu dispositivo.</div></footer>

<div class="cmdk" id="cmdk"><div class="box">
  <input id="cmdInput" placeholder="Escribe para buscar… (json, contraseña, qr, color)" autocomplete="off">
  <ul id="cmdList"></ul>
  <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nl:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("nl:" + k, JSON.stringify(v)); } catch {} }
};
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Copiado ✓");
}
function download(name, data, type = "text/plain") {
  const url = data instanceof Blob ? URL.createObjectURL(data) : URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const fmt = (n, d = 2) => Number.isFinite(n) ? n.toLocaleString("es-ES", { maximumFractionDigits: d }) : "—";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
const bytesHuman = b => b < 1024 ? b + " B" : b < 1048576 ? fmt(b / 1024, 1) + " KB" : fmt(b / 1048576, 2) + " MB";
const b64enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").replace(/\s/g, "")), c => c.charCodeAt(0)));
const copyBtn = (id, label = "Copiar") => `<button class="btn" data-copy="${id}">⧉ ${label}</button>`;
function bindCopy(root) {
  $$("[data-copy]", root).forEach(b => b.onclick = () => { const t = $("#" + b.dataset.copy, root); copy(t.value ?? t.textContent); });
}

/* ---------- categorías ---------- */
const CATS = {
  texto: { name: "Texto", ic: "✍️" },
  dev: { name: "Desarrollo", ic: "💻" },
  seg: { name: "Seguridad", ic: "🔐" },
  color: { name: "Color y diseño", ic: "🎨" },
  img: { name: "Imagen", ic: "🖼️" },
  calc: { name: "Cálculo", ic: "🧮" },
  util: { name: "Utilidades", ic: "⏱️" }
};

/* ---------- herramientas ---------- */
const TOOLS = [];
const tool = (id, cat, ic, name, desc, kw, render) => TOOLS.push({ id, cat, ic, name, desc, kw, render });

/* ===== TEXTO ===== */
tool("contador", "texto", "🔢", "Contador de palabras", "Palabras, caracteres, frases, párrafos y tiempo de lectura en vivo.", "caracteres letras count", el => {
  el.innerHTML = `<div class="panel"><textarea id="t" placeholder="Pega o escribe tu texto aquí…" style="min-height:240px;font-family:inherit;font-size:15px"></textarea></div>
  <div class="panel"><div class="kpis" id="k"></div><div class="hint" id="top"></div></div>`;
  const t = $("#t", el), k = $("#k", el);
  const upd = () => {
    const s = t.value, words = s.match(/[\p{L}\p{N}'’-]+/gu) || [];
    const sent = (s.match(/[^.!?¡¿…]+[.!?…]+/g) || []).length || (s.trim() ? 1 : 0);
    const para = s.split(/\n\s*\n/).filter(p => p.trim()).length;
    const data = [["Palabras", words.length], ["Caracteres", [...s].length], ["Sin espacios", [...s.replace(/\s/g, "")].length], ["Frases", sent], ["Párrafos", para], ["Lectura", Math.max(words.length ? 1 : 0, Math.round(words.length / 230)) + " min"], ["Voz alta", Math.round(words.length / 150) + " min"]];
    k.innerHTML = data.map(([a, b]) => `<div class="kpi"><b>${typeof b == "number" ? fmt(b, 0) : b}</b><span>${a}</span></div>`).join("");
    const freq = {}; words.filter(w => w.length > 3).forEach(w => { w = w.toLowerCase(); freq[w] = (freq[w] || 0) + 1; });
    const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 8);
    $("#top", el).innerHTML = top.length ? "Palabras más repetidas: " + top.map(([w, n]) => `<b>${esc(w)}</b> (${n})`).join(" · ") : "";
    store.set("contador", s);
  };
  t.value = store.get("contador", ""); t.oninput = upd; upd();
});

tool("mayusculas", "texto", "🔠", "Convertidor de mayúsculas", "MAYÚSCULAS, minúsculas, Título, camelCase, snake_case, kebab-case y más.", "case camel snake kebab title", el => {
  el.innerHTML = `<div class="panel"><textarea id="t" placeholder="Escribe el texto…"></textarea>
  <div class="row" style="margin-top:12px" id="b"></div></div>`;
  const words = s => s.replace(/([a-z])([A-Z])/g, "$1 $2").split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  const ops = {
    "MAYÚSCULAS": s => s.toUpperCase(), "minúsculas": s => s.toLowerCase(),
    "Tipo Título": s => s.toLowerCase().replace(/(^|\s)(\p{L})/gu, (m, a, b) => a + b.toUpperCase()),
    "Tipo oración": s => s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu, (m, a, b) => a + b.toUpperCase()),
    "camelCase": s => words(s).map((w, i) => i ? cap(w) : w.toLowerCase()).join(""),
    "PascalCase": s => words(s).map(cap).join(""),
    "snake_case": s => words(s).map(w => w.toLowerCase()).join("_"),
    "kebab-case": s => words(s).map(w => w.toLowerCase()).join("-"),
    "CONSTANT": s => words(s).map(w => w.toUpperCase()).join("_"),
    "aLtErNaDo": s => [...s].map((c, i) => i % 2 ? c.toUpperCase() : c.toLowerCase()).join(""),
    "Invertir": s => [...s].reverse().join("")
  };
  const b = $("#b", el), t = $("#t", el);
  Object.keys(ops).forEach(k => { const x = document.createElement("button"); x.className = "btn"; x.textContent = k; x.onclick = () => { t.value = ops[k](t.value); }; b.appendChild(x); });
  b.insertAdjacentHTML("beforeend", `<span style="flex:1"></span>` + copyBtn("t")); bindCopy(el);
});

tool("lineas", "texto", "📋", "Ordenar y limpiar líneas", "Ordena, elimina duplicados, líneas vacías, espacios y numera listas.", "duplicados sort unique lista", el => {
  el.innerHTML = `<div class="panel"><textarea id="t" placeholder="Una entrada por línea…"></textarea>
  <div class="row" style="margin-top:12px" id="b"></div><div class="hint" id="i"></div></div>`;
  const t = $("#t", el), b = $("#b", el);
  const L = () => t.value.split("\n"), coll = new Intl.Collator("es", { numeric: true, sensitivity: "base" });
  const ops = {
    "A → Z": l => l.sort(coll.compare), "Z → A": l => l.sort(coll.compare).reverse(),
    "Por longitud": l => l.sort((a, b) => a.length - b.length),
    "Quitar duplicados": l => [...new Set(l)], "Quitar vacías": l => l.filter(x => x.trim()),
    "Recortar espacios": l => l.map(x => x.trim().replace(/\s+/g, " ")),
    "Aleatorio": l => { for (let i = l.length - 1; i > 0; i--) { const j = rnd(i + 1); [l[i], l[j]] = [l[j], l[i]]; } return l; },
    "Numerar": l => l.map((x, i) => `${i + 1}. ${x}`), "Invertir orden": l => l.reverse()
  };

tool("diff", "texto", "🆚", "Comparar textos", "Encuentra las diferencias línea a línea entre dos textos.", "diferencias comparador compare", el => {
  el.innerHTML = `<div class="cols"><div class="panel"><b class="muted">Original</b><textarea id="a" style="margin-top:8px"></textarea></div><div class="panel"><b class="muted">Modificado</b><textarea id="b" style="margin-top:8px"></textarea></div></div>
  <div class="panel"><div class="row" style="margin-bottom:10px"><b id="s"></b></div><div class="diff" id="o"></div></div>`;
  const run = () => {
    const A = $("#a", el).value.split("\n"), B = $("#b", el).value.split("\n");
    const n = A.length, m = B.length;
    if (n * m > 4e6) { $("#o", el).textContent = "Textos demasiado grandes."; return; }
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, html = "", add = 0, del = 0;
    while (i < n || j < m) {
      if (i < n && j < m && A[i] === B[j]) { html += `<div>  ${esc(A[i])}</div>`; i++; j++; }
      else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { html += `<div class="a">+ ${esc(B[j])}</div>`; j++; add++; }
      else { html += `<div class="d">− ${esc(A[i])}</div>`; i++; del++; }
    }
    $("#o", el).innerHTML = html; $("#s", el).innerHTML = add + del ? `<span style="color:var(--ok)">+${add} añadidas</span> · <span style="color:var(--bad)">−${del} eliminadas</span>` : "✓ Los textos son idénticos";
  };
  $("#a", el).oninput = $("#b", el).oninput = run; run();
});

const hexToRgb = h => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map(c => c + c).join(""); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbToHex = (r, g, b) => "#" + [r, g, b].map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0")).join("");
const rgbToHsl = (r, g, b) => { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [Math.round(h), Math.round(s * 100), Math.round(l * 100)]; };
const hslToRgb = (h, s, l) => { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return [f(0) * 255, f(8) * 255, f(4) * 255]; };
const lum = ([r, g, b]) => { const c = [r, g, b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };

function fileDrop(zone, input, cb, multiple) {
  zone.onclick = () => input.click(); input.multiple = !!multiple;
  input.onchange = () => { if (input.files.length) multiple ? cb([...input.files]) : cb(input.files[0]); input.value = ""; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add("over"); }; zone.ondragleave = () => zone.classList.remove("over");
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove("over"); const f = [...e.dataTransfer.files]; if (f.length) multiple ? cb(f) : cb(f[0]); };
}
const loadImg = f => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });

  const run = () => { const C = +$("#c", el).value, r = +$("#i", el).value / 1200, n = Math.round(+$("#y", el).value * 12); if (!C || !n) return;
    const q = r ? C * r / (1 - (1 + r) ** -n) : C / n, tot = q * n;
    $("#o", el).innerHTML = [[fmt(q), "Cuota mensual"], [fmt(tot - C), "Intereses totales"], [fmt(tot), "Total a pagar"], [n, "Cuotas"]].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
    $("#m", el).style.width = C / tot * 100 + "%"; let s = C, rows = "<tr><th>Año</th><th>Intereses</th><th>Capital</th><th>Pendiente</th></tr>";
    for (let yr = 1; yr <= n / 12; yr++) { let ii = 0, cc = 0; for (let k = 0; k < 12 && s > 0; k++) { const it = s * r; ii += it; cc += q - it; s -= q - it; } rows += `<tr><td>${yr}</td><td>${fmt(ii)}</td><td>${fmt(cc)}</td><td>${fmt(Math.max(0, s))}</td></tr>`; }
    $("#tb", el).innerHTML = rows; };
  $$("input", el).forEach(i => i.oninput = run); run();
});

/* ===== UTILIDADES ===== */
tool("cronometro", "util", "⏱️", "Cronómetro y temporizador", "Cronómetro con vueltas y temporizador con alarma sonora.", "timer stopwatch alarma cuenta atras", el => {
  el.innerHTML = `<div class="cols"><div class="panel"><b class="muted">Cronómetro</b><div class="big" id="sw">00:00.00</div><div class="row" style="justify-content:center"><button class="btn p" id="ss">▶ Iniciar</button><button class="btn" id="lp">⚑ Vuelta</button><button class="btn" id="rs">↺</button></div><div id="laps" class="hint" style="font-family:var(--mono)"></div></div>
  <div class="panel"><b class="muted">Temporizador</b><div class="big" id="tm">05:00</div><div class="row" style="justify-content:center"><input type="number" id="mm" value="5" min="0" style="width:80px"> min <input type="number" id="sc" value="0" min="0" max="59" style="width:80px"> s</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn p" id="ts">▶ Iniciar</button><button class="btn" id="tr">↺</button></div></div></div>`;
  const f = ms => { const m = Math.floor(ms / 6e4), s = Math.floor(ms / 1e3) % 60, c = Math.floor(ms / 10) % 100; return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(c).padStart(2, "0")}`; };
  let st = 0, acc = 0, run = false, laps = [];
  const loop = () => { if (!el.isConnected) return; if (run) $("#sw", el).textContent = f(acc + performance.now() - st); if (tRun) { const left = Math.max(0, tEnd - Date.now()); $("#tm", el).textContent = f(left).slice(0, 5); if (!left) { tRun = false; $("#ts", el).textContent = "▶ Iniciar"; beep(); } } requestAnimationFrame(loop); };
  $("#ss", el).onclick = () => { if (run) { acc += performance.now() - st; run = false; $("#ss", el).textContent = "▶ Continuar"; } else { st = performance.now(); run = true; $("#ss", el).textContent = "⏸ Pausa"; } };
  $("#lp", el).onclick = () => { if (!run) return; laps.unshift(acc + performance.now() - st); $("#laps", el).innerHTML = laps.map((l, i) => `Vuelta ${laps.length - i}: ${f(l)}`).join("<br>"); };
  $("#rs", el).onclick = () => { run = false; acc = 0; laps = []; $("#sw", el).textContent = f(0); $("#laps", el).innerHTML = ""; $("#ss", el).textContent = "▶ Iniciar"; };
  let tRun = false, tEnd = 0, tLeft = 3e5;
  const beep = () => { try { const a = new AudioContext(); [0, .35, .7].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.3, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .3); o.start(a.currentTime + t); o.stop(a.currentTime + t + .3); }); } catch {} toast("⏰ ¡Tiempo!"); };
  const setT = () => { tLeft = ((+$("#mm", el).value || 0) * 60 + (+$("#sc", el).value || 0)) * 1000; $("#tm", el).textContent = f(tLeft).slice(0, 5); };
  $("#mm", el).oninput = $("#sc", el).oninput = () => !tRun && setT();
  $("#ts", el).onclick = () => { if (tRun) { tLeft = tEnd - Date.now(); tRun = false; $("#ts", el).textContent = "▶ Continuar"; } else if (tLeft > 0) { tEnd = Date.now() + tLeft; tRun = true; $("#ts", el).textContent = "⏸ Pausa"; } };
  $("#tr", el).onclick = () => { tRun = false; $("#ts", el).textContent = "▶ Iniciar"; setT(); };
  loop();
});

tool("aleatorio", "util", "🎲", "Números aleatorios y sorteos", "Números al azar, lanzar dados, cara o cruz y elegir ganador de una lista.", "random sorteo dado moneda ruleta", el => {
  el.innerHTML = `<div class="cols"><div class="panel"><b class="muted">Número aleatorio</b><div class="row" style="margin-top:10px"><label class="f">Mín.<input type="number" id="a" value="1"></label><label class="f">Máx.<input type="number" id="b" value="100"></label><label class="f">Cantidad<input type="number" id="n" value="1" min="1"></label></div><label class="check" style="margin-top:10px"><input type="checkbox" id="u"> Sin repetir</label><div class="big" id="o">—</div><div class="row" style="justify-content:center"><button class="btn p" id="g">🎲 Generar</button><button class="btn" id="d">⚀ Dado</button><button class="btn" id="m">🪙 Moneda</button></div></div>
  <div class="panel"><b class="muted">Sorteo entre una lista</b><textarea id="l" style="margin-top:10px;min-height:150px;font-family:inherit">Ana\nLuis\nMarta\nCarlos\nSofía</textarea><div class="row" style="margin-top:10px"><button class="btn p" id="s">🏆 Elegir ganador</button></div><div class="big" id="w" style="font-size:clamp(28px,6vw,46px)"></div></div></div>`;
  const o = $("#o", el);
  $("#g", el).onclick = () => { let a = Math.ceil(+$("#a", el).value), b = Math.floor(+$("#b", el).value); if (a > b) [a, b] = [b, a]; const n = Math.min(1000, Math.max(1, +$("#n", el).value || 1)), span = b - a + 1;
    if ($("#u", el).checked && n > span) { o.textContent = "Rango insuficiente"; o.style.fontSize = "22px"; return; } const s = new Set(), out = [];
    while (out.length < n) { const v = a + rnd(span); if ($("#u", el).checked) { if (s.has(v)) continue; s.add(v); } out.push(v); }
    o.style.fontSize = out.length > 1 ? "26px" : ""; o.textContent = out.join(", "); };
  $("#d", el).onclick = () => { o.style.fontSize = ""; const v = rnd(6); o.textContent = [..."⚀⚁⚂⚃⚄⚅"][v] + " " + (v + 1); };
  $("#m", el).onclick = () => { o.style.fontSize = ""; o.textContent = rnd(2) ? "🪙 Cara" : "🪙 Cruz"; };
  $("#s", el).onclick = () => { const l = $("#l", el).value.split("\n").map(x => x.trim()).filter(Boolean); if (!l.length) return; let k = 0; const w = $("#w", el);
    const iv = setInterval(() => { w.textContent = l[rnd(l.length)]; if (++k > 18) { clearInterval(iv); w.textContent = "🏆 " + l[rnd(l.length)]; } }, 70); };
});

tool("bloc", "util", "🗒️", "Bloc de notas rápido", "Notas que se guardan solas en tu navegador. Descarga como .txt.", "notas notepad apuntes", el => {
  el.innerHTML = `<div class="panel"><textarea id="t" style="min-height:420px;font-family:inherit;font-size:16px" placeholder="Empieza a escribir… se guarda automáticamente."></textarea><div class="row" style="margin-top:10px">${copyBtn("t")}<button class="btn" id="dl">↓ .txt</button><button class="btn" id="cl">🗑 Borrar</button><span class="muted" id="s" style="margin-left:auto;font-size:13px"></span></div></div>`;
  const t = $("#t", el); t.value = store.get("bloc", "");
  t.oninput = () => { store.set("bloc", t.value); $("#s", el).textContent = "Guardado · " + new Date().toLocaleTimeString("es-ES"); };
  $("#dl", el).onclick = () => download("notas.txt", t.value); $("#cl", el).onclick = () => { if (confirm("¿Borrar todas las notas?")) { t.value = ""; t.oninput(); } }; bindCopy(el);
});

tool("teclado", "util", "⌨️", "Test de velocidad de escritura", "Mide tus palabras por minuto y precisión en 60 segundos.", "wpm mecanografia typing speed", el => {
  const T = ["La práctica constante es la clave para escribir más rápido sin cometer errores.", "El sol se escondía detrás de las montañas mientras el viento movía suavemente los árboles del valle.", "Un buen programador escribe código que los humanos pueden entender, no solo las máquinas.", "Cada mañana camino hasta la panadería de la esquina para comprar pan recién hecho y un café caliente.", "La curiosidad es el motor que impulsa a la ciencia a descubrir los secretos del universo."];
  el.innerHTML = `<div class="panel"><div id="txt" style="font-size:20px;line-height:1.7;font-family:var(--mono);user-select:none"></div><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Empieza a escribir para iniciar…" style="margin-top:14px;font-size:18px"></div><div class="panel"><div class="kpis" id="k"></div><div class="row" style="margin-top:12px"><button class="btn p" id="r">↻ Nuevo texto</button></div></div>`;
  let target = "", t0 = 0, done = false;
  const reset = () => { target = T.slice().sort(() => Math.random() - .5).join(" "); t0 = 0; done = false; $("#in", el).value = ""; $("#in", el).disabled = false; draw(); stats(); };
  const draw = () => { const v = $("#in", el).value; $("#txt", el).innerHTML = [...target.slice(0, Math.max(160, v.length + 80))].map((c, i) => i < v.length ? `<span style="color:${v[i] === c ? "var(--ok)" : "var(--bad)"};${v[i] !== c ? "background:rgba(229,72,77,.15)" : ""}">${esc(c)}</span>` : i === v.length ? `<span style="border-left:2px solid var(--accent)">${esc(c)}</span>` : `<span class="muted">${esc(c)}</span>`).join(""); };
  const stats = () => { const v = $("#in", el).value, sec = t0 ? Math.min(60, (Date.now() - t0) / 1000) : 0; let ok = 0; [...v].forEach((c, i) => c === target[i] && ok++);
    const wpm = sec > 1 ? Math.round(ok / 5 / (sec / 60)) : 0; $("#k", el).innerHTML = [[Math.max(0, Math.ceil(60 - sec)) + "s", "Tiempo restante"], [wpm, "Palabras/min"], [v.length ? Math.round(ok / v.length * 100) + "%" : "—", "Precisión"], [ok, "Caracteres correctos"]].map(([a, b]) => `<div class="kpi"><b>${a}</b><span>${b}</span></div>`).join("");
    if (sec >= 60 && !done) { done = true; $("#in", el).disabled = true; toast(`¡Terminado! ${wpm} ppm`); } };
  $("#in", el).oninput = () => { if (!t0) { t0 = Date.now(); const iv = setInterval(() => { if (!el.isConnected || done) return clearInterval(iv); stats(); }, 250); } draw(); stats(); };
  $("#r", el).onclick = reset; reset();
});

/* ---------- favoritos / recientes ---------- */
let favs = store.get("favs", []), recent = store.get("recent", []);
const isFav = id => favs.includes(id);
function toggleFav(id) { favs = isFav(id) ? favs.filter(x => x !== id) : [...favs, id]; store.set("favs", favs); toast(isFav(id) ? "★ Añadido a favoritos" : "Quitado de favoritos"); }

/* ---------- búsqueda ---------- */
function search(q) {
  q = norm(q.trim()); if (!q) return TOOLS;
  const terms = q.split(/\s+/);
  return TOOLS.map(t => { const hay = norm(`${t.name} ${t.desc} ${t.kw} ${CATS[t.cat].name}`), nm = norm(t.name);
    let s = 0; for (const w of terms) { if (!hay.includes(w)) return null; s += nm.startsWith(w) ? 5 : nm.includes(w) ? 3 : 1; } return [t, s]; })
    .filter(Boolean).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

/* ---------- vistas ---------- */
const app = $("#app");
const card = t => `<a class="card" href="#/${t.id}"><div class="ic">${t.ic}</div><div><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p></div><button class="fav ${isFav(t.id) ? "on" : ""}" data-fav="${t.id}" aria-label="Favorito">${isFav(t.id) ? "★" : "☆"}</button></a>`;
function bindFavs(root) { $$("[data-fav]", root).forEach(b => b.onclick = e => { e.preventDefault(); e.stopPropagation(); toggleFav(b.dataset.fav); const on = isFav(b.dataset.fav); b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; if (!location.hash.slice(2)) homeLists(); }); }

let curCat = "all", curQ = "";
function home() {
  document.title = "Nikolai Lab · Herramientas online gratis";
  app.innerHTML = `<section class="hero"><span class="pill">⚡ ${TOOLS.length} herramientas · 100 % privadas · sin registro</span>
  <h1>Todas tus herramientas, <span class="grad">en un solo lugar</span></h1>
  <p>Texto, código, seguridad, color, imágenes y cálculos. Rápidas, gratuitas y sin subir nada a ningún servidor: todo ocurre en tu navegador.</p>
  <div class="filter"><input id="q" placeholder="¿Qué necesitas hacer? Prueba “json”, “qr” o “contraseña”" autocomplete="off" value="${esc(curQ)}"></div>
  <div class="stats"><div><b>${TOOLS.length}</b>herramientas</div><div><b>${Object.keys(CATS).length}</b>categorías</div><div><b>0</b>bytes enviados</div><div><b>∞</b>usos gratis</div></div></section>
  <div class="chips" id="chips"></div><div id="lists"></div>`;
  const chips = $("#chips");
  chips.innerHTML = `<button class="chip" data-c="all">Todas<small>${TOOLS.length}</small></button>` + Object.entries(CATS).map(([k, c]) => `<button class="chip" data-c="${k}">${c.ic} ${c.name}<small>${TOOLS.filter(t => t.cat === k).length}</small></button>`).join("");
  $$(".chip", chips).forEach(b => b.onclick = () => { curCat = b.dataset.c; homeLists(); });
  $("#q").oninput = e => { curQ = e.target.value; homeLists(); };
  homeLists();
}
function homeLists() {
  const box = $("#lists"); if (!box) return;
  $$("#chips .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === curCat));
  let html = "";
  if (curQ.trim()) { const r = search(curQ).filter(t => curCat === "all" || t.cat === curCat);
    html = r.length ? `<h2 class="section-title">Resultados <small>${r.length}</small></h2><div class="grid">${r.map(card).join("")}</div>` : `<div class="empty">No hay herramientas para “${esc(curQ)}”.</div>`;
  } else {
    if (curCat === "all") {
      const f = favs.map(id => TOOLS.find(t => t.id === id)).filter(Boolean), rc = recent.map(id => TOOLS.find(t => t.id === id)).filter(Boolean).slice(0, 4);
      if (f.length) html += `<h2 class="section-title">★ Favoritos</h2><div class="grid">${f.map(card).join("")}</div>`;
      if (rc.length) html += `<h2 class="section-title">🕘 Usadas recientemente</h2><div class="grid">${rc.map(card).join("")}</div>`;
    }
    Object.entries(CATS).filter(([k]) => curCat === "all" || curCat === k).forEach(([k, c]) => { const l = TOOLS.filter(t => t.cat === k);
      html += `<h2 class="section-title">${c.ic} ${c.name} <small>${l.length}</small></h2><div class="grid">${l.map(card).join("")}</div>`; });
  }
  box.innerHTML = html; bindFavs(box);
}
function view(id) {
  const t = TOOLS.find(x => x.id === id); if (!t) return home();
  recent = [id, ...recent.filter(x => x !== id)].slice(0, 8); store.set("recent", recent);
  document.title = t.name + " · Nikolai Lab";
  app.innerHTML = `<section class="tool"><nav class="crumbs"><a href="#/">Inicio</a><span>›</span><a href="#/" data-cat="${t.cat}">${CATS[t.cat].name}</a><span>›</span><span>${esc(t.name)}</span></nav>
  <div class="tool-head"><div class="ic">${t.ic}</div><div><h1>${esc(t.name)}</h1><p>${esc(t.desc)}</p></div><button class="fav" id="fv" aria-label="Favorito">${isFav(id) ? "★" : "☆"}</button></div>
  <div id="body"></div><div class="related"><h2 class="section-title">Más de ${CATS[t.cat].name}</h2><div class="grid" id="rel"></div></div></section>`;
  $("[data-cat]", app).onclick = () => { curCat = t.cat; curQ = ""; };
  $("#fv").onclick = () => { toggleFav(id); $("#fv").textContent = isFav(id) ? "★" : "☆"; };
  const rel = TOOLS.filter(x => x.cat === t.cat && x.id !== id).slice(0, 4); $("#rel").innerHTML = rel.map(card).join(""); bindFavs($("#rel"));
  if (!rel.length) $(".related", app).remove();
  try { t.render($("#body")); } catch (e) { $("#body").innerHTML = `<div class="panel msg bad">Error al cargar la herramienta: ${esc(e.message)}</div>`; console.error(e); }
  scrollTo(0, 0);
}
function route() { const id = decodeURIComponent(location.hash.replace(/^#\/?/, "")); id ? view(id) : home(); }
addEventListener("hashchange", route);

/* ---------- paleta de comandos ---------- */
const cmdk = $("#cmdk"), ci = $("#cmdInput"), cl = $("#cmdList"); let sel = 0, res = [];
function openCmd() { cmdk.classList.add("open"); ci.value = ""; drawCmd(); setTimeout(() => ci.focus(), 10); }
function closeCmd() { cmdk.classList.remove("open"); }
function drawCmd() { res = search(ci.value).slice(0, 12); sel = Math.min(sel, Math.max(0, res.length - 1));
  cl.innerHTML = res.length ? res.map((t, i) => `<li class="${i === sel ? "sel" : ""}" data-i="${i}"><em>${t.ic}</em><div><b>${esc(t.name)}</b><small>${esc(CATS[t.cat].name)} · ${esc(t.desc)}</small></div></li>`).join("") : `<li class="muted">Sin resultados</li>`;
  $$("li[data-i]", cl).forEach(li => { li.onclick = () => go(+li.dataset.i); li.onmousemove = () => { if (sel !== +li.dataset.i) { sel = +li.dataset.i; $$("li", cl).forEach((x, j) => x.classList.toggle("sel", j === sel)); } }; });
  const s = $("li.sel", cl); if (s) s.scrollIntoView({ block: "nearest" }); }
function go(i) { if (res[i]) { location.hash = "#/" + res[i].id; closeCmd(); } }
ci.oninput = () => { sel = 0; drawCmd(); };
ci.onkeydown = e => { if (e.key === "ArrowDown") { sel = Math.min(res.length - 1, sel + 1); drawCmd(); e.preventDefault(); } else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); drawCmd(); e.preventDefault(); } else if (e.key === "Enter") go(sel); };
cmdk.onclick = e => { if (e.target === cmdk) closeCmd(); };
$("#openCmd").onclick = openCmd;
addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); cmdk.classList.contains("open") ? closeCmd() : openCmd(); }
  else if (e.key === "Escape") closeCmd();
  else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openCmd(); }
});

/* ---------- tema ---------- */
const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
applyTheme(store.get("theme", null));
$("#themeBtn").onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; const t = dark ? "light" : "dark"; applyTheme(t); store.set("theme", t); };

route();
</script>
</body>
</html>
