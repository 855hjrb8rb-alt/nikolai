<style>
/* Layout: mapa a pantalla completa; buscador flotante arriba a la izquierda, panel lateral (escritorio) u hoja inferior (móvil), controles a la derecha. */
:root {
  --surface: #ffffff;
  --surface-2: #f4f1ec;
  --ink: #1e1b18;
  --ink-2: #625a52;
  --line: #e4ddd3;
  --accent: #9e3326;
  --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(40,25,10,.18), 0 2px 8px rgba(40,25,10,.14);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-sello: "Special Elite", "Courier New", Courier, monospace;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface: #1e2024; --surface-2: #282b31; --ink: #ecebe7; --ink-2: #a9a49c; --line: #393c43;
  --accent: #e2806d; --accent-ink: #1b0e0b; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --surface: #1e2024; --surface-2: #282b31; --ink: #ecebe7; --ink-2: #a9a49c; --line: #393c43;
  --accent: #e2806d; --accent-ink: #1b0e0b; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 10px rgba(0,0,0,.45); color-scheme: dark; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--surface-2); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
#mapa { position: fixed; inset: 0; z-index: 0; }
.leaflet-container { font-family: var(--font-ui); background: var(--oceano, #b5d2e5); outline: none; }
.icon { width: 22px; height: 22px; fill: currentColor; flex: none; display: block; }
.icon.sm { width: 18px; height: 18px; }

/* ---------- Buscador ---------- */
#buscador { position: fixed; z-index: 30; top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-width: 392px; }
.caja { display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); height: 48px; padding: 0 4px; }
.caja input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 500 15px var(--font-ui); padding: 0 6px; height: 100%; }
.caja input::placeholder { color: var(--ink-2); font-weight: 400; }
.btn-ico { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.btn-ico:hover { background: var(--surface-2); color: var(--ink); }
.btn-ico:focus-visible, .chip:focus-visible, .accion:focus-visible, .ctrl:focus-visible, .fila:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-ico.acento { color: var(--accent); }
.sep { width: 1px; height: 24px; background: var(--line); flex: none; }
#sugerencias { margin-top: 6px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; max-height: min(60vh, 420px); overflow-y: auto; }
.fila { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
.fila:hover, .fila.activa { background: var(--surface-2); }
.fila .txt { min-width: 0; flex: 1; }
.fila .t1 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila .t2 { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila .km { color: var(--ink-2); font: 12px var(--font-mono); flex: none; }
.burbuja { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); }

#chips { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px; border-radius: 17px; border: 0; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip .icon { width: 18px; height: 18px; }

/* ---------- Panel (lateral / hoja inferior) ---------- */
#panel { position: fixed; z-index: 20; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column;
  left: 0; right: 0; bottom: 0; max-height: 58%; border-radius: 16px 16px 0 0; transition: transform .25s ease; }
#panel.alto { max-height: calc(100% - 76px - env(safe-area-inset-top, 0px)); }
#panel .asa { border: 0; background: transparent; padding: 8px 0 2px; cursor: pointer; display: grid; place-items: center; flex: none; }
#panel .asa span { width: 36px; height: 4px; border-radius: 2px; background: var(--line); display: block; }
#panel-cuerpo { overflow-y: auto; padding: 0 0 calc(16px + env(safe-area-inset-bottom, 0px)); min-height: 0; flex: 1; }
#panel-cerrar { position: absolute; top: 8px; right: 8px; z-index: 2; background: var(--surface); }
@media (min-width: 760px) {
  #panel { top: 0; bottom: 0; right: auto; width: 408px; max-height: none; border-radius: 0; padding-top: calc(76px + env(safe-area-inset-top, 0px)); }

function partirAntimeridiano(pts) {

}
const fmtKm = (km) => km < 1 ? Math.round(km * 1000) + " m" : km < 100 ? km.toFixed(1).replace(".", ",") + " km" : Math.round(km).toLocaleString("es-ES") + " km";
function fmtHoras(h) {

function fmtCoord(lat, lon) {

}
const normLon = (lon) => ((((lon + 180) % 360) + 360) % 360) - 180;

/* ================== Geometría de territorios ================== */
const TERR = [];       // { id, n, f, feat, bb, area, c:[lat,lon], tipo }
function enAnillo(x, y, r) {
  let d = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) d = !d;
  }
  return d;
}
const poligonos = (g) => g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
function territorioEn(lat, lon) {
  lon = normLon(lon);
  for (const t of TERR) {
    for (const x of [lon, lon + 360, lon - 360]) {
      if (x < t.bb[0] || x > t.bb[2] || lat < t.bb[1] || lat > t.bb[3]) continue;
      for (const p of poligonos(t.feat.geometry)) {
        if (enAnillo(x, lat, p[0]) && !p.slice(1).some((h) => enAnillo(x, lat, h))) return t;
      }
    }
  }
  return null;
}
function analizar(feat, tipo) {
  let bb = [180, 90, -180, -90], mejor = null, total = 0;
  for (const p of poligonos(feat.geometry)) {
    const r = p[0]; let a = 0, cx = 0, cy = 0;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [x0, y0] = r[j], [x1, y1] = r[i], k = x0 * y1 - x1 * y0;
      a += k; cx += (x0 + x1) * k; cy += (y0 + y1) * k;
      if (x1 < bb[0]) bb[0] = x1; if (x1 > bb[2]) bb[2] = x1; if (y1 < bb[1]) bb[1] = y1; if (y1 > bb[3]) bb[3] = y1;
    }
    a /= 2; const A = Math.abs(a); total += A;
    if (!mejor || A > mejor.a && A > 0) mejor = { a: A, c: a ? [cy / (6 * a), cx / (6 * a)] : [r[0][1], r[0][0]] };
  }
  return { bb, area: total, c: mejor ? mejor.c : [0, 0], tipo };
}

/* ================== Estado ================== */
let estilo = almacen.leer("estilo", null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "noche" : "mapa");
if (!ESTILOS[estilo]) estilo = "mapa";
const capas = Object.assign({ fronteras: false, frentes: true, ciudades: true, etiquetas: true, cohetes: true, cuadricula: false }, almacen.leer("capas", {}));
let guardados = almacen.leer("guardados", []);
let mapa, capaMundo, capaEEUU, capaFrentes, capaCuadricula, capaCiudades, capaEtiquetas, capaCohetes, capaRuta, capaMedida, capaPin;
const marcadoresLugar = new Map();
let modoElegir = null, midiendo = false, puntosMedida = [];
const esMovil = () => matchMedia("(max-width: 759px)").matches;

/* ================== Mapa ================== */
function iniciarMapa() {
  mapa = L.map("mapa", {
    zoomControl: false, preferCanvas: true, minZoom: 2, maxZoom: 10, zoomSnap: 0.5, worldCopyJump: false,
    maxBounds: [[-86, -230], [86, 230]], maxBoundsViscosity: 0.9, attributionControl: true, tapHold: true,
  }).setView([30, -20], 2.5);
  mapa.attributionControl.setPrefix(false).addAttribution("Fronteras: Natural Earth · Mapa de fans de la serie El hombre en el castillo");
  L.control.scale({ metric: true, imperial: false, position: "bottomright", maxWidth: 110 }).addTo(mapa);
  mapa.createPane("frentes").style.zIndex = 420;
  mapa.createPane("rutas").style.zIndex = 450;
  mapa.createPane("etiquetas").style.zIndex = 600;

  mapa.on("zoomend", actualizarZoom);

  mapa.on("contextmenu", (e) => { e.originalEvent && e.originalEvent.preventDefault(); abrirMenuCtx(e); });
  mapa.on("movestart", cerrarMenuCtx);

function estiloTerritorio(f) {
  const e = ESTILOS[estilo];
  if (e.real) return { fillColor: e.tierra, fillOpacity: 1, color: e.lineaReal, weight: f.properties.us ? 0.5 : 0.8, opacity: 1 };
  const fac = f.properties.f;
  const mostrar = capas.fronteras;
  return { fillColor: e.fill[fac], fillOpacity: 1, color: mostrar ? e.stroke[fac] : e.fill[fac], weight: mostrar ? e.borde + 0.2 : 0.6, opacity: 1, dashArray: mostrar && f.properties.us ? "3 3" : null };
}

// Une los anillos cortados en ±180° para que no se dibujen franjas de lado a lado del mapa.
function desenrollar(feat) {
  for (const p of poligonos(feat.geometry)) {
    for (const r of p) {
      let off = 0; const nuevo = [r[0].slice()];
      for (let i = 1; i < r.length; i++) {
        const d = r[i][0] - r[i - 1][0];
        if (d > 180) off -= 360; else if (d < -180) off += 360;
        nuevo.push([r[i][0] + off, r[i][1]]);
      }
      if (off !== 0) continue; // anillo que rodea un polo (Antártida): se deja como está
      let media = 0; nuevo.forEach((c) => (media += c[0])); media /= nuevo.length;
      const ajuste = media > 180 ? -360 : media < -180 ? 360 : 0;
      nuevo.forEach((c, i) => { r[i][0] = c[0] + ajuste; });
    }
  }
}
function construirTerritorios(datos) {
  const mundo = topojson.feature(datos.mundo, datos.mundo.objects.countries).features;
  mundo.forEach(desenrollar);
  const eeuu = topojson.feature(datos.eeuu, datos.eeuu.objects.states).features;
  eeuu.forEach((f) => (f.properties.us = true));
  const alAtravesar = (f, capa) => {
    capa.on("mouseover", () => { if (!modoElegir && !midiendo) capa.setStyle({ weight: 2.2, color: ESTILOS[estilo].frente, dashArray: null }); });
    capa.on("mouseout", () => capa.setStyle(estiloTerritorio(f)));
    capa.on("click", (e) => {
      if (modoElegir || midiendo) return;
      L.DomEvent.stopPropagation(e);
      cerrarMenuCtx();
      abrirTerritorio(TERR.find((t) => t.feat === f), e.latlng);
    });
  };
  capaMundo = L.geoJSON(mundo, { style: estiloTerritorio, onEachFeature: alAtravesar, smoothFactor: 0.6 }).addTo(mapa);
  capaEEUU = L.geoJSON(eeuu, { style: estiloTerritorio, onEachFeature: alAtravesar, smoothFactor: 0.6 }).addTo(mapa);
  eeuu.forEach((f, i) => TERR.push({ id: "us-" + i, n: f.properties.n, f: f.properties.f, feat: f, ...analizar(f, "estado") }));
  mundo.forEach((f, i) => TERR.push({ id: "w-" + i, n: f.properties.n, f: f.properties.f, feat: f, ...analizar(f, "pais") }));
  // Ajustes de etiqueta para territorios cuyo centro cae lejos.
  const fijo = { "Estados Unidos": null, "Francia": [46.6, 2.4], "Noruega": [61.5, 9], "Rusia": [61, 95], "Canadá": [57, -100], "Chile": [-31, -71], "Indonesia": [-1.5, 114] };
  TERR.forEach((t) => { if (fijo[t.n]) t.c = fijo[t.n]; });

  const meshW = topojson.mesh(datos.mundo, datos.mundo.objects.countries, (a, b) => a !== b && a.properties.f !== b.properties.f);
  const meshU = topojson.mesh(datos.eeuu, datos.eeuu.objects.states, (a, b) => a !== b && a.properties.f !== b.properties.f);
  capaFrentes = L.geoJSON({ type: "FeatureCollection", features: [{ type: "Feature", geometry: meshW }, { type: "Feature", geometry: meshU }] },
    { pane: "frentes", interactive: false, style: () => ({ color: ESTILOS[estilo].frente, weight: 1.6, opacity: 0.85, dashArray: "6 4" }) });

  capaCuadricula = L.layerGroup();
  for (let lat = -75; lat <= 75; lat += 15) capaCuadricula.addLayer(L.polyline([[lat, -180], [lat, 180]], { interactive: false, weight: lat === 0 ? 1.2 : 0.7 }));
  for (let lon = -180; lon <= 180; lon += 15) capaCuadricula.addLayer(L.polyline([[-85, lon], [85, lon]], { interactive: false, weight: lon === 0 ? 1.2 : 0.7 }));

  construirEtiquetas();
  construirCiudades();
  construirCohetes();
  aplicarEstilo();
}

function construirEtiquetas() {
  capaEtiquetas = L.layerGroup();
  const icono = (html, cls) => L.divIcon({ className: "", html: `<div class="et ${cls}">${html}</div>`, iconSize: [0, 0] });
  for (const e of ETIQ_FAC) {
    const m = L.marker([e.lat, e.lon], { icon: icono(esc(e.t).replace("\n", "<br>"), "et-faccion" + (e.peq ? " peq" : "")), interactive: false, pane: "etiquetas", keyboard: false });
    m._z = e.z; capaEtiquetas.addLayer(m);
  }
  for (const t of TERR) {
    const a = t.area;
    let min = a > 900 ? 3 : a > 200 ? 4 : a > 40 ? 5 : a > 6 ? 6 : a > 0.8 ? 7 : 8;
    if (t.tipo === "estado") min = Math.max(5, min);
    if (t.n === "Estados Unidos") continue;
    const m = L.marker(t.c, { icon: icono(esc(t.n), t.tipo === "estado" ? "et-estado" : "et-pais"), interactive: false, pane: "etiquetas", keyboard: false });
    m._z = [min, 99]; capaEtiquetas.addLayer(m);
  }
}

function construirCiudades() {
  capaCiudades = L.layerGroup();
  for (const l of LUGARES) {
    const min = l.t === "capital" ? 2 : l.t === "serie" ? 3 : l.t === "base" ? 4 : 4;
    const m = L.marker([l.lat, l.lon], {
      icon: L.divIcon({ className: "", html: `<div class="ciudad ${l.t}" data-id="${l.id}"><span class="pt"></span><span class="nm">${esc(l.n)}</span></div>`, iconSize: [0, 0] }),
      keyboard: true, title: l.n, riseOnHover: true,
    });
    m._z = [min, 99]; m._lugar = l;
    m.on("click", (e) => { if (modoElegir || midiendo) return alHacerClicMapa(e); L.DomEvent.stopPropagation(e); abrirLugar(l); });
    capaCiudades.addLayer(m); marcadoresLugar.set(l.id, m);
  }
}

function construirCohetes() {
  capaCohetes = L.layerGroup();
  const porId = Object.fromEntries(LUGARES.map((l) => [l.id, l]));
  for (const r of RUTAS_COHETE) {
    const a = porId[r.de], b = porId[r.a];
    for (const seg of partirAntimeridiano(granCirculo([a.lat, a.lon], [b.lat, b.lon], 96))) {
      capaCohetes.addLayer(L.polyline(seg, { pane: "rutas", weight: 1.6, dashArray: "2 6", lineCap: "round", interactive: true }).bindTooltip(r.n, { sticky: true }));
    }
  }
}

function actualizarZoom() {
  const z = mapa.getZoom();
  const visible = (m) => z >= m._z[0] && z <= m._z[1];
  for (const grupo of [capaEtiquetas, capaCiudades]) {
    if (!grupo) continue;
    grupo.eachLayer((m) => { const el = m.getElement(); if (el) el.style.display = visible(m) ? "" : "none"; });
  }
  $("#btn-mas").disabled = z >= mapa.getMaxZoom(); $("#btn-menos").disabled = z <= mapa.getMinZoom();
}

function aplicarEstilo() {
  const e = ESTILOS[estilo];
  const raiz = document.documentElement.style;
  raiz.setProperty("--oceano", e.oceano); raiz.setProperty("--halo", e.halo); raiz.setProperty("--halo-solido", e.haloS);
  raiz.setProperty("--et-faccion", e.etF); raiz.setProperty("--et-pais", e.etP); raiz.setProperty("--et-ciudad", e.etC); raiz.setProperty("--pt", e.ciudad);
  const cont = mapa.getContainer();
  Object.keys(ESTILOS).forEach((k) => cont.classList.toggle("estilo-" + k, k === estilo));
  capaMundo.setStyle(estiloTerritorio); capaEEUU.setStyle(estiloTerritorio);
  capaFrentes.setStyle({ color: e.frente });
  capaCuadricula.eachLayer((l) => l.setStyle({ color: e.grid }));
  capaCohetes.eachLayer((l) => l.setStyle({ color: e.frente }));
  alternar(capaFrentes, capas.frentes && !e.real);
  alternar(capaCuadricula, capas.cuadricula);
  alternar(capaCiudades, capas.ciudades);
  alternar(capaEtiquetas, capas.etiquetas);
  alternar(capaCohetes, capas.cohetes && !e.real);
  capaEtiquetas.eachLayer((m) => { const el = m.getElement(); if (el && el.firstChild.classList.contains("et-faccion")) el.firstChild.style.visibility = e.real ? "hidden" : ""; });
  actualizarZoom();
  dibujarMiniaturas();
}
function alternar(capa, on) { if (on && !mapa.hasLayer(capa)) capa.addTo(mapa); if (!on && mapa.hasLayer(capa)) mapa.removeLayer(capa); }

/* Miniaturas de estilo dibujadas con los colores reales del mapa */
function pintarMini(cv, k) {
  const e = ESTILOS[k], g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.fillStyle = e.oceano; g.fillRect(0, 0, W, H);
  const zonas = [["RA", [[.05, .2], [.42, .12], [.48, .55], [.3, .7], [.12, .6]]], ["JP", [[.02, .25], [.13, .22], [.16, .62], [.06, .66]]], ["N", [[.13, .22], [.24, .2], [.26, .62], [.16, .62]]],
    ["R", [[.55, .1], [.98, .08], [.98, .45], [.7, .5], [.58, .42]]], ["R", [[.55, .52], [.72, .5], [.75, .92], [.6, .95]]], ["J", [[.78, .48], [.98, .46], [.98, .72], [.82, .7]]], ["X", [[.25, .72], [.42, .74], [.36, .98], [.28, .95]]]];

  }
}
function dibujarMiniaturas() {
  const cont = $("#estilos");
  if (!cont.children.length) {
    cont.innerHTML = Object.entries(ESTILOS).map(([k, e]) => `<button class="estilo" data-estilo="${k}"><canvas width="128" height="104"></canvas>${esc(e.n)}</button>`).join("");
    cont.querySelectorAll(".estilo").forEach((b) => b.addEventListener("click", () => { estilo = b.dataset.estilo; almacen.guardar("estilo", estilo); aplicarEstilo(); }));
  }
  cont.querySelectorAll(".estilo").forEach((b) => { pintarMini(b.querySelector("canvas"), b.dataset.estilo); b.classList.toggle("on", b.dataset.estilo === estilo); });
  const siguiente = estilo === "mapa" ? "archivo" : "mapa";
  pintarMini($("#capas-mini"), siguiente);

/* ================== Panel ================== */

}

function ponerPin(lat, lon) {

  capaPin.addLayer(L.marker([lat, lon], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", iconSize: [0, 0],
    html: `<div class="pin"><svg viewBox="0 0 30 40"><path d="M15 0C6.7 0 0 6.6 0 14.8 0 26 15 40 15 40s15-14 15-25.2C30 6.6 23.3 0 15 0z" fill="#c0392b"/><circle cx="15" cy="14.5" r="5.5" fill="#6e1a12"/></svg></div>` }) }));

function cabecera(f, titulo, sello) {
  const e = ESTILOS[estilo].real ? ESTILOS.archivo : ESTILOS[estilo];
  const a = e.fill[f] || "#888", b = e.stroke[f] || "#555";
  return `<div class="cabecera">
    <div class="fondo" style="background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, transparent 2px 9px),
      radial-gradient(120% 90% at 20% 0%, ${a}, ${b} 70%, #2a1d16 130%)"></div>
    <div class="sello">${esc(sello)}</div>
    <div class="exp">${esc(titulo)}</div></div>`;
}
const expediente = (lat, lon) => "Expediente " + String(Math.abs(Math.round(lat * 37 + lon * 91)) % 9000 + 1000) + "-62";
const pastilla = (f) => `<span class="pastilla"><span class="punto" style="background:${(ESTILOS[estilo].fill || ESTILOS.mapa.fill)[f]}"></span>${esc(FACCIONES[f].n)}</span>`;
const estaGuardado = (lat, lon) => guardados.some((g) => Math.abs(g.lat - lat) < 1e-4 && Math.abs(g.lon - lon) < 1e-4);

function botonesAccion(obj) {
  const g = estaGuardado(obj.lat, obj.lon);
  return `<div class="acciones">
    <button class="accion primaria" data-acc="ruta">${'<span class="aro">' + ico("ruta") + "</span>"}Cómo llegar</button>
    <button class="accion" data-acc="guardar"><span class="aro">${ico(g ? "guardado" : "guardar")}</span>${g ? "Guardado" : "Guardar"}</button>
    <button class="accion" data-acc="cerca"><span class="aro">${ico("cerca")}</span>Cercanos</button>
    <button class="accion" data-acc="copiar"><span class="aro">${ico("copiar")}</span>Copiar</button>
  </div>`;
}
function conectarAcciones(obj) {
  cuerpo.querySelectorAll("[data-acc]").forEach((b) => b.addEventListener("click", () => {
    const acc = b.dataset.acc;
    if (acc === "ruta") abrirRuta(null, obj);
    if (acc === "guardar") { alternarGuardado(obj); const g = estaGuardado(obj.lat, obj.lon); b.innerHTML = `<span class="aro">${ico(g ? "guardado" : "guardar")}</span>${g ? "Guardado" : "Guardar"}`; }
    if (acc === "cerca") abrirCercanos(obj);
    if (acc === "copiar") copiar(`${obj.n} — ${fmtCoord(obj.lat, obj.lon)}`, "Coordenadas copiadas");
  }));
  cuerpo.querySelectorAll("[data-lugar]").forEach((b) => b.addEventListener("click", () => abrirLugar(LUGARES.find((l) => l.id === b.dataset.lugar))));
}

function abrirLugar(l, { volar = true } = {}) {
  if (!l) return;
  const tipo = { capital: "Capital", ciudad: "Ciudad", serie: "Lugar de la serie", base: "Base y puerto" }[l.t];
  const t = territorioEn(l.lat, l.lon);
  abrirPanel(`${cabecera(l.f, expediente(l.lat, l.lon), FACCIONES[l.f].c + " · 1962")}
    <div class="ficha"><h2>${esc(l.n)}</h2><div class="sub">${esc(l.s)}</div><div class="sub" style="margin-top:8px">${pastilla(l.f)}<span>${esc(tipo)}</span></div></div>
    ${botonesAccion(l)}
    <div class="texto"><p>${esc(l.d)}</p></div>
    <div class="datos">
      <div class="dato">${ico("pin")}<div class="v mono">${fmtCoord(l.lat, l.lon)}<small>Coordenadas</small></div></div>

function volarA(lat, lon, z) {

}

/* ================== Búsqueda ================== */
function buscar(q, max = 8) {
  const n = norm(q); if (!n) return [];
  const m = n.match(/^(-?\d+(?:[.,]\d+)?)\s*[, ]\s*(-?\d+(?:[.,]\d+)?)$/);
  if (m) {
    const lat = parseFloat(m[1].replace(",", ".")), lon = parseFloat(m[2].replace(",", "."));
    if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return [{ tipo: "coord", n: fmtCoord(lat, lon), s: "Coordenadas", lat, lon }];
  }
  const puntua = (txt) => { const t = norm(txt); return t.startsWith(n) ? 3 : t.split(/[\s\-]/).some((w) => w.startsWith(n)) ? 2 : t.includes(n) ? 1 : 0; };
  const res = [];
  for (const l of LUGARES) { const p = puntua(l.n); if (p) res.push({ p: p + 0.5, tipo: "lugar", n: l.n, s: l.s, lat: l.lat, lon: l.lon, ref: l }); }
  for (const [k, f] of Object.entries(FACCIONES)) { const p = puntua(f.n); if (p && k !== "U") res.push({ p: p + 0.4, tipo: "faccion", n: f.n, s: "Facción · " + TERR.filter((t) => t.f === k).length + " territorios", ref: k }); }
  for (const t of TERR) { const p = puntua(t.n); if (p) res.push({ p, tipo: "territorio", n: t.n, s: (t.tipo === "estado" ? "Antiguo estado · " : "Territorio · ") + FACCIONES[t.f].n, lat: t.c[0], lon: t.c[1], ref: t }); }
  return res.sort((a, b) => b.p - a.p || a.n.localeCompare(b.n, "es")).slice(0, max);
}
const icoRes = (r) => r.tipo === "lugar" ? (r.ref.t === "capital" ? "capital" : r.ref.t === "serie" ? "pelicula" : r.ref.t === "base" ? "cohete" : "pin") : r.tipo === "faccion" ? "bandera" : r.tipo === "coord" ? "pin" : "globo";
function htmlResultados(res) {
  return res.map((r, i) => `<button class="fila" data-i="${i}"><span class="burbuja">${ico(icoRes(r), "icon sm")}</span><span class="txt"><span class="t1">${esc(r.n)}</span><span class="t2">${esc(r.s)}</span></span></button>`).join("");
}
function elegirResultado(r) {
  $("#q").value = r.n; $("#sugerencias").hidden = true; $("#q").blur();
  if (r.tipo === "lugar") return abrirLugar(r.ref);
  if (r.tipo === "territorio") {
    const capa = (r.ref.tipo === "estado" ? capaEEUU : capaMundo).getLayers().find((c) => c.feature === r.ref.feat);
    const b = r.ref.n === "Rusia" ? L.latLngBounds([[41, 27], [78, 180]]) : capa.getBounds();
    mapa.flyToBounds(b, { duration: 0.8, paddingTopLeft: esMovil() ? [0, 0] : [408, 0], maxZoom: 6 });
    return abrirTerritorio(r.ref, L.latLng(r.ref.c[0], r.ref.c[1]));
  }
  if (r.tipo === "faccion") return abrirFaccion(r.ref);
  if (r.tipo === "coord") {
    volarA(r.lat, r.lon, 6);
    const t = territorioEn(r.lat, r.lon);
    if (t) abrirTerritorio(t, L.latLng(r.lat, r.lon)); else { abrirQueHay(L.latLng(r.lat, r.lon)); }
  }
}
function abrirFaccion(k) {
  const f = FACCIONES[k], ts = TERR.filter((t) => t.f === k).sort((a, b) => b.area - a.area), ls = LUGARES.filter((l) => l.f === k);
  abrirPanel(`${cabecera(k, "Bloque · 1962", f.c)}
    <div class="ficha"><h2>${esc(f.n)}</h2><div class="sub">${ts.length} territorios · ${ls.length} lugares señalados</div></div>

    ${ls.length ? `<div class="seccion">Lugares</div><div class="lista">${ls.map((l) => filaLugar(l)).join("")}</div>` : ""}
    <div class="seccion">Territorios</div><div class="nota">${ts.map((t) => esc(t.n)).join(" · ")}</div>`);
  conectarAcciones({});

  let b = L.latLngBounds([]); capasF.forEach((c) => b.extend(c.getBounds()));

const q = $("#q"), sug = $("#sugerencias");

/* ================== Cómo llegar ================== */
const MODOS = {
  coche: { n: "Coche", i: "coche", v: 70, tierra: true, factor: 1.3 },
  tren: { n: "Tren", i: "tren", v: 90, tierra: true, factor: 1.2 },
  avion: { n: "Avión", i: "avion", v: 480, extra: 1 },
  cohete: { n: "Cohete", i: "cohete", v: 9000, extra: 1.5 },
};
const ruta = { origen: null, destino: null, modo: almacen.leer("modo", "coche") };
function puntoDe(obj) { return obj ? { n: obj.n, lat: obj.lat, lon: obj.lon } : null; }
function abrirRuta(origen, destino) {
  if (origen !== undefined) ruta.origen = puntoDe(origen);
  if (destino !== undefined) ruta.destino = puntoDe(destino);
  const campo = (k, ph, fin) => `<label class="campo"><span class="marca${fin ? " fin" : ""}"></span>
      <input id="r-${k}" autocomplete="off" placeholder="${ph}" value="${ruta[k] ? esc(ruta[k].n) : ""}" aria-label="${ph}">
      <button class="elegir" data-elegir="${k}" title="Elegir en el mapa" aria-label="Elegir ${ph.toLowerCase()} en el mapa">${ico("pin", "icon sm")}</button></label>`;
  abrirPanel(`<h2 class="titulo-vista">Cómo llegar</h2>
    <div class="ruta-campos"><div class="col">${campo("origen", "Punto de partida")}${campo("destino", "Destino", true)}</div>
      <button class="btn-ico" id="r-cambiar" aria-label="Intercambiar origen y destino">${ico("cambiar")}</button></div>
    <div class="ruta-sug" id="r-sug" hidden></div>
    <div class="modos">${Object.entries(MODOS).map(([k, m]) => `<button class="modo${k === ruta.modo ? " on" : ""}" data-modo="${k}">${ico(m.i, "icon sm")}${m.n}</button>`).join("")}</div>
    <div id="r-res"></div>`, { alto: true });
  for (const k of ["origen", "destino"]) {
    const inp = $("#r-" + k), caja = $("#r-sug");
    inp.addEventListener("input", () => {
      const res = buscar(inp.value, 6).filter((r) => r.tipo !== "faccion");
      if (!inp.value.trim() || !res.length) { caja.hidden = true; return; }
      caja.innerHTML = htmlResultados(res); caja.hidden = false;
      caja.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => {
        const r = res[+b.dataset.i]; ruta[k] = { n: r.n, lat: r.lat, lon: r.lon }; inp.value = r.n; caja.hidden = true; calcularRuta();
      }));
    });
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { const r = buscar(inp.value, 1)[0]; if (r && r.tipo !== "faccion") { ruta[k] = { n: r.n, lat: r.lat, lon: r.lon }; inp.value = r.n; $("#r-sug").hidden = true; calcularRuta(); } } });
  }
  cuerpo.querySelectorAll("[data-elegir]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); empezarElegir(b.dataset.elegir); }));
  $("#r-cambiar").addEventListener("click", () => { [ruta.origen, ruta.destino] = [ruta.destino, ruta.origen]; abrirRuta(); });
  cuerpo.querySelectorAll("[data-modo]").forEach((b) => b.addEventListener("click", () => { ruta.modo = b.dataset.modo; almacen.guardar("modo", ruta.modo); cuerpo.querySelectorAll("[data-modo]").forEach((x) => x.classList.toggle("on", x === b)); calcularRuta(); }));
  calcularRuta();
  if (!ruta.origen) setTimeout(() => $("#r-origen") && $("#r-origen").focus(), 50);
}
function empezarElegir(k) {
  modoElegir = k; $("#elegir-aviso").hidden = false; $("#elegir-aviso").textContent = k === "origen" ? "Toca el mapa para elegir el punto de partida" : "Toca el mapa para elegir el destino";
  mapa.getContainer().style.cursor = "crosshair";
  if (esMovil()) panel.hidden = true;
}
function terminarElegir() { modoElegir = null; $("#elegir-aviso").hidden = true; mapa.getContainer().style.cursor = ""; panel.hidden = false; }

function calcularRuta() {
  const res = $("#r-res"); if (!res) return;
  capaRuta.clearLayers();
  const { origen: a, destino: b } = ruta, modo = MODOS[ruta.modo];
  if (!a || !b) { res.innerHTML = `<div class="vacio">Elige un punto de partida y un destino: escribe una ciudad o un territorio, o toca ${ico("pin", "icon sm")} para marcarlo en el mapa.</div>`; return; }
  const pts = granCirculo([a.lat, a.lon], [b.lat, b.lon], 200), km = distancia([a.lat, a.lon], [b.lat, b.lon]);
  // Recorrido: facciones atravesadas y tramos de mar.
  const paso = km / 200; let mar = 0, peorMar = 0; const tramos = [];
  for (const p of pts) {
    const t = territorioEn(p[0], p[1]);
    if (!t) { mar += paso; peorMar = Math.max(peorMar, mar); continue; }
    mar = 0; if (tramos[tramos.length - 1] !== t.f) tramos.push(t.f);
  }
  const cruces = Math.max(0, tramos.length - 1);
  const e = ESTILOS[estilo];
  for (const seg of partirAntimeridiano(pts)) {
    capaRuta.addLayer(L.polyline(seg, { pane: "rutas", color: "#ffffff", weight: 8, opacity: 0.9, interactive: false }));
    capaRuta.addLayer(L.polyline(seg, { pane: "rutas", color: ruta.modo === "cohete" || ruta.modo === "avion" ? e.frente : "#1a73e8", weight: 4.5, opacity: 1, dashArray: modo.tierra ? null : "8 8", interactive: false }));
  }
  const fin = (lat, lon, c) => L.circleMarker([lat, lon], { pane: "rutas", radius: 6, color: "#fff", weight: 2.5, fillColor: c, fillOpacity: 1 });
  capaRuta.addLayer(fin(a.lat, a.lon, "#333")); capaRuta.addLayer(fin(b.lat, b.lon, "#c0392b"));
  mapa.flyToBounds(L.latLngBounds(pts.map((p) => [p[0], p[1]])).pad(0.2), { duration: 0.8, paddingTopLeft: esMovil() ? [0, 0] : [408, 0], paddingBottomRight: esMovil() ? [0, innerHeight * 0.45] : [0, 0], maxZoom: 7 });

  const chipsTramos = tramos.length ? `<div class="tramos">${tramos.map((f) => pastilla(f)).join('<span class="flecha">→</span>')}</div>` : "";
  if (modo.tierra && peorMar > 250) {
    res.innerHTML = `<div class="resultado"><div class="aviso">${ico("aviso")}<div><b>No hay ruta por tierra.</b> El trayecto atraviesa unos ${fmtKm(peorMar)} de mar. Prueba en avión o en cohete.</div></div>
      <div class="nota" style="padding:0">Distancia en línea recta: ${fmtKm(km)}</div></div>`;
    return;
  }
  const kmReal = km * (modo.factor || 1);
  let horas = kmReal / modo.v + (modo.extra || 0) + (modo.tierra ? cruces * 1.5 : 0);
  const avisos = [];
  if (cruces && modo.tierra) avisos.push(`Cruzas ${cruces} ${cruces === 1 ? "frontera" : "fronteras"} entre bloques. Se suma 1 h 30 min por cada control y necesitas salvoconducto.`);
  if (tramos.includes("N") && modo.tierra) avisos.push("La Zona Neutral no tiene policía de ninguna potencia, pero sí cazarrecompensas. Viaja de día.");
  if (ruta.modo === "cohete") {
    const reich = (p) => { const t = territorioEn(p.lat, p.lon); return t && (t.f === "R" || t.f === "RA"); };
    avisos.push(reich(a) || reich(b) ? "Los vuelos en cohete son un servicio del Reich: necesitas autorización de viaje del Reich." : "Ninguno de los dos extremos está en el Reich: no hay servicio regular de cohete en esta ruta.");
  }
  if (tramos.includes("R") && tramos.includes("J")) avisos.push("La ruta une territorio del Reich y del Imperio Japonés. Con la tensión entre las dos potencias, los pasos pueden cerrarse sin aviso.");
  res.innerHTML = `<div class="resultado">
    <div class="grande">${fmtHoras(horas)}<small>${fmtKm(kmReal)}</small></div>
    <div class="nota" style="padding:0">${modo.tierra ? "Trazado aproximado por tierra." : "Ruta directa por el aire (ortodrómica)."} Velocidad media de 1962: ${modo.v.toLocaleString("es-ES")} km/h.</div>
    ${chipsTramos}
    ${avisos.map((t) => `<div class="aviso">${ico("aviso")}<div>${esc(t)}</div></div>`).join("")}
  </div>`;
}

/* ================== Clic en el mapa, medir, menú contextual ================== */
function alHacerClicMapa(e) {

function alternarMedir(on = !midiendo, desde) {
  midiendo = on; $("#btn-medir").classList.toggle("on", on); $("#medida").hidden = !on;
  puntosMedida = desde ? [desde] : []; capaMedida.clearLayers();
  mapa.getContainer().style.cursor = on ? "crosshair" : "";
  if (on) { if (esMovil()) cerrarPanel(); dibujarMedida(); }
}
function dibujarMedida() {
  capaMedida.clearLayers(); let total = 0;
  for (let i = 1; i < puntosMedida.length; i++) total += distancia(puntosMedida[i - 1], puntosMedida[i]);
  if (puntosMedida.length > 1) {
    capaMedida.addLayer(L.polyline(puntosMedida, { pane: "rutas", color: "#fff", weight: 6, opacity: 0.9, interactive: false }));
    capaMedida.addLayer(L.polyline(puntosMedida, { pane: "rutas", color: "#222", weight: 2.5, dashArray: "6 5", interactive: false }));
  }
  puntosMedida.forEach((p) => capaMedida.addLayer(L.circleMarker(p, { pane: "rutas", radius: 5, color: "#222", weight: 2, fillColor: "#fff", fillOpacity: 1, interactive: false })));
  $("#medida-total").textContent = fmtKm(total);
  $("#medida-sub").textContent = puntosMedida.length < 2 ? "Toca el mapa para añadir puntos" : `${puntosMedida.length} puntos · ${(total / 1.852).toLocaleString("es-ES", { maximumFractionDigits: 0 })} millas náuticas`;
}
$("#btn-medir").addEventListener("click", () => alternarMedir());
$("#medida-cerrar").addEventListener("click", () => alternarMedir(false));
$("#medida-deshacer").addEventListener("click", () => { puntosMedida.pop(); dibujarMedida(); });

const menu = $("#menu-ctx");
function abrirMenuCtx(e) {
  if (midiendo || modoElegir) return;
  const ll = e.latlng, lat = +ll.lat.toFixed(4), lon = +normLon(ll.lng).toFixed(4), t = territorioEn(lat, lon);
  const punto = { n: t ? t.n : "Punto en el mar", lat, lon, f: t ? t.f : "U" };
  menu.innerHTML = `<div class="cab"><div class="mono">${fmtCoord(lat, lon)}</div><div class="nota" style="padding:2px 0 0">${t ? esc(t.n) + " · " + esc(FACCIONES[t.f].n) : "Aguas internacionales"}</div></div>
    <button class="fila" data-m="que">${ico("info", "icon sm")}¿Qué hay aquí?</button>
    <button class="fila" data-m="desde">${ico("ruta", "icon sm")}Cómo llegar desde aquí</button>
    <button class="fila" data-m="hasta">${ico("pin", "icon sm")}Cómo llegar hasta aquí</button>
    <button class="fila" data-m="medir">${ico("regla", "icon sm")}Medir distancia</button>
    <button class="fila" data-m="guardar">${ico("guardar", "icon sm")}Guardar este punto</button>
    <button class="fila" data-m="copiar">${ico("copiar", "icon sm")}Copiar coordenadas</button>`;
  menu.hidden = false;
  const p = e.containerPoint, w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(p.x, innerWidth - w - 12) + "px"; menu.style.top = Math.min(p.y, innerHeight - h - 12) + "px";
  menu.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => {
    cerrarMenuCtx();
    const k = b.dataset.m;
    if (k === "que") abrirQueHay(ll);
    if (k === "desde") abrirRuta(punto, undefined);
    if (k === "hasta") abrirRuta(undefined, punto);
    if (k === "medir") alternarMedir(true, [ll.lat, ll.lng]);
    if (k === "guardar") alternarGuardado(punto);
    if (k === "copiar") copiar(`${lat}, ${lon}`, "Coordenadas copiadas");
  }));
}
function cerrarMenuCtx() { menu.hidden = true; }
function abrirQueHay(ll) {
  const lat = ll.lat, lon = normLon(ll.lng), t = territorioEn(lat, lon);
  if (t) return abrirTerritorio(t, L.latLng(lat, lon));
  const cerca = LUGARES.map((l) => [l, distancia([lat, lon], [l.lat, l.lon])]).sort((a, b) => a[1] - b[1]).slice(0, 4);
  const obj = { n: "Punto en el mar", lat: +lat.toFixed(4), lon: +lon.toFixed(4), f: "U" };
  abrirPanel(`<div class="ficha"><h2>Aguas internacionales</h2><div class="sub mono">${fmtCoord(lat, lon)}</div></div>${botonesAccion(obj)}
    <div class="seccion">Lugares más cercanos</div><div class="lista">${cerca.map(([l, km]) => filaLugar(l, km)).join("")}</div>`);
  conectarAcciones(obj); ponerPin(lat, lon);
}

/* ================== Controles ================== */
$("#btn-mas").addEventListener("click", () => mapa.zoomIn());
$("#btn-menos").addEventListener("click", () => mapa.zoomOut());
$("#btn-mundo").addEventListener("click", () => mapa.flyTo([30, -20], esMovil() ? 2 : 2.5, { duration: 0.8 }));
$("#btn-pantalla").addEventListener("click", async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
  catch (e) { aviso("Este visor no permite pantalla completa"); }
});
$("#btn-ruta").addEventListener("click", () => abrirRuta());
const panelCapas = $("#capas");
$("#capas-btn").addEventListener("click", (e) => { e.stopPropagation(); panelCapas.hidden = !panelCapas.hidden; });
document.addEventListener("click", (e) => { if (!e.target.closest("#capas, #capas-btn")) panelCapas.hidden = true; if (!e.target.closest("#menu-ctx")) cerrarMenuCtx(); });
for (const k of ["fronteras", "frentes", "ciudades", "etiquetas", "cohetes", "cuadricula"]) {
  const c = $("#c-" + k); c.checked = !!capas[k];
  c.addEventListener("change", () => { capas[k] = c.checked; almacen.guardar("capas", capas); aplicarEstilo(); });
}

/* ================== Menú lateral ================== */
const cajon = $("#cajon"), velo = $("#velo");
function abrirCajon() {
  cajon.innerHTML = `<div class="marca-app"><b>Mapas del Castillo</b><small>El mundo de la serie en 1962</small></div>
    <button class="fila" data-c="guardados">${ico("guardar")}Guardados</button>
    <button class="fila" data-c="leyenda">${ico("leyenda")}Leyenda de bloques</button>
    <button class="fila" data-c="cronologia">${ico("cronologia")}Cronología</button>
    <button class="fila" data-c="ruta">${ico("ruta")}Cómo llegar</button>
    <button class="fila" data-c="medir">${ico("regla")}Medir distancia</button>
    <button class="fila" data-c="atajos">${ico("teclado")}Atajos de teclado</button>
    <button class="fila" data-c="acerca">${ico("info")}Acerca de este mapa</button>`;
  cajon.hidden = false; velo.hidden = false;
  cajon.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => {
    cerrarCajon(); const k = b.dataset.c;
    if (k === "guardados") abrirGuardados();
    if (k === "leyenda") abrirLeyenda();
    if (k === "cronologia") abrirCronologia();
    if (k === "ruta") abrirRuta();
    if (k === "medir") alternarMedir(true);
    if (k === "atajos") abrirPanel(`<h2 class="titulo-vista">Atajos de teclado</h2><div class="lista leyenda">
      ${[["/", "Ir al buscador"], ["+ / −", "Acercar o alejar"], ["Flechas", "Mover el mapa"], ["M", "Medir distancia"], ["R", "Cómo llegar"], ["L", "Leyenda"], ["Esc", "Cerrar panel o herramienta"], ["Clic derecho", "Menú del punto (mantén pulsado en móvil)"]]
        .map(([k, v]) => `<div class="fila"><span class="mono" style="min-width:96px">${k}</span><span class="txt">${v}</span></div>`).join("")}</div>`);
    if (k === "acerca") abrirPanel(`<h2 class="titulo-vista">Acerca de este mapa</h2><div class="texto">
      <p>Un mapa de fans del mundo de la serie <i>El hombre en el castillo</i> en 1962: el Gran Reich Nazi, el Imperio Japonés y la Zona Neutral que los separa en Norteamérica.</p>
      <p>Las fronteras entre bloques son una interpretación aproximada; la serie no muestra todos los límites con precisión. Los nombres de los territorios son los de antes de la guerra.</p>
      <p>Las líneas de costa y fronteras salen de Natural Earth (dominio público). No es un producto oficial de la serie.</p></div>`);
  }));
}
function cerrarCajon() { cajon.hidden = true; velo.hidden = true; }
$("#btn-menu").addEventListener("click", abrirCajon);
velo.addEventListener("click", cerrarCajon);

function abrirLeyenda() {
  const pal = ESTILOS[estilo].real ? ESTILOS.mapa : ESTILOS[estilo];
  abrirPanel(`<h2 class="titulo-vista">Leyenda de bloques</h2><div class="nota">Toca un bloque para ver sus territorios.</div><div class="lista">
    ${ORDEN_FAC.filter((k) => k !== "U").map((k) => `<button class="fila" data-fac="${k}" style="align-items:flex-start"><span class="muestra" style="background:${pal.fill[k]}"></span>
      <span class="txt"><span class="t1">${esc(FACCIONES[k].n)}</span><span class="t2" style="white-space:normal">${esc(FACCIONES[k].d)}</span></span></button>`).join("")}
    <div class="fila" style="cursor:default"><span class="muestra" style="background:none;box-shadow:none;border-top:2px dashed ${pal.frente};height:0;margin-top:10px"></span><span class="txt"><span class="t1">Frente entre bloques</span><span class="t2">Límite entre dos potencias</span></span></div>
    <div class="fila" style="cursor:default"><span class="muestra" style="background:none;box-shadow:none;border-top:2px dotted ${pal.frente};height:0;margin-top:10px"></span><span class="txt"><span class="t1">Ruta de cohete o vuelo</span><span class="t2">Conexiones regulares de 1962</span></span></div>
  </div>`);
  cuerpo.querySelectorAll("[data-fac]").forEach((b) => b.addEventListener("click", () => abrirFaccion(b.dataset.fac)));
}
function abrirCronologia() {
  const hitos = [
    ["1945", "Alemania lanza una bomba atómica sobre Washington D. C. Estados Unidos se rinde y su territorio se reparte entre el Reich y Japón."],
    ["1947", "Se traza la Zona Neutral en las Montañas Rocosas como colchón entre los dos imperios."],
    ["1962", "Época de la serie. San Francisco vive bajo los Estados Japoneses del Pacífico y Nueva York bajo el Reich Americano. Circulan películas prohibidas que muestran una guerra con otro final."],
    ["1962", "La salud del Führer empeora y la sucesión en Berlín amenaza la paz con Japón."],
  ];
  abrirPanel(`<h2 class="titulo-vista">Cronología</h2><div class="cronologia">${hitos.map(([a, t]) => `<div class="hito"><b>${a}</b><span>${esc(t)}</span></div>`).join("")}</div>`);
}

/* ================== Teclado ================== */
document.addEventListener("keydown", (e) => {
  const escribiendo = e.target.matches("input, textarea");
  if (e.key === "Escape") {
    if (!cajon.hidden) return cerrarCajon();
    if (modoElegir) return terminarElegir();
    if (midiendo) return alternarMedir(false);
    if (!menu.hidden) return cerrarMenuCtx();
    if (!panelCapas.hidden) { panelCapas.hidden = true; return; }
    if (!panel.hidden) return cerrarPanel();
  }
  if (escribiendo || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); q.focus(); }
  if (e.key === "m" || e.key === "M") alternarMedir();
  if (e.key === "r" || e.key === "R") abrirRuta();
  if (e.key === "l" || e.key === "L") abrirLeyenda();
});
addEventListener("resize", () => document.body.classList.toggle("movil", esMovil()));

/* ================== Arranque ================== */
iniciarMapa();
fetch("datos/mundo.json")
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((datos) => {
    construirTerritorios(datos);
    const id = decodeURIComponent(location.hash.slice(1));
    const l = LUGARES.find((x) => x.id === id);
    if (l) abrirLugar(l);
  })
  .catch(() => aviso("No se pudieron cargar las fronteras del mundo. Abre el mapa desde un servidor web, no como archivo suelto."));
</script>
