<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>George</title>
  <meta name="robots" content="noindex">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(80% 60% at 50% 40%, #1a0c05, #050302 75%) #050302;
      color: #c98a5e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 24px; overflow: hidden;
    }
    .ash { position: fixed; inset: 0; opacity: .4; pointer-events: none;
      background:
        repeating-radial-gradient(circle at 30% 20%, rgba(120,70,30,.12) 0 2px, transparent 2px 40px),
        repeating-radial-gradient(circle at 70% 80%, rgba(90,50,20,.1) 0 2px, transparent 2px 60px);
      animation: drift 20s linear infinite; }
    @keyframes drift { to { transform: translateY(-30px); } }
    .wrap { position: relative; z-index: 2; max-width: 520px; }
    .mark { font-size: 64px; filter: grayscale(1) brightness(.7); margin-bottom: 14px; }
    h1 { font-size: clamp(24px, 6vw, 40px); margin: 0 0 12px; letter-spacing: .02em; }
    p { color: #7a5a3e; font-size: 15px; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="ash"></div>
  <div class="wrap">
    <div class="mark">⚰</div>
    <h1>George se ha ido.</h1>
    <p>No quedó nada. Gracias por el tiempo juntos.</p>
  </div>
  <script>
    // Borra cualquier rastro de George que siga en este dispositivo.
    try { for (const k of Object.keys(localStorage)) if (k.startsWith("nikolai")) localStorage.removeItem(k); } catch (e) {}
    try { sessionStorage.clear(); } catch (e) {}
    try { if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch (e) {}
    try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())); } catch (e) {}
    try { if (window.indexedDB && indexedDB.databases) indexedDB.databases().then((ds) => ds.forEach((d) => d.name && indexedDB.deleteDatabase(d.name))); } catch (e) {}
  </script>
</body>
</html>
