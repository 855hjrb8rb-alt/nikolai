<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIKOLAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#12114a">
</head>
<body>
  <!-- Escenario: haces de luz, suelo en perspectiva y anillos -->
  <div class="scene" aria-hidden="true">
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div class="floor"></div>
    <div class="floor-ring r1"></div><div class="floor-ring r2"></div><div class="floor-ring r3"></div>
    <div class="vignette"></div>
  </div>

  <header class="hud-top mono">
    <div class="brand"><b>NIKOLAI</b><span>ASSIST·OS</span></div>
    <nav class="dock" id="dock" aria-label="Módulos"></nav>
    <div class="top-right">
      <span id="netState" class="net-chip" hidden></span>
      <span id="langState">ES</span>
      <span id="clock">00:00:00</span>
    </div>
  </header>

  <!-- Columnas laterales de telemetría -->
  <aside class="side side-left mono" id="sideLeft"></aside>
  <aside class="side side-right mono" id="sideRight"></aside>

  <!-- Carrusel 3D de módulos -->
  <main class="stage" id="stage">
    <div class="carousel" id="carousel"></div>
  </main>

  <!-- Módulo abierto -->
  <section class="panel" id="panel" hidden>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <header class="panel-head">
      <div class="mono panel-meta"><span id="panelTag">M-00</span><span class="online">● ONLINE</span></div>
      <button class="close" id="panelClose" data-target aria-label="Cerrar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <h2 id="panelTitle"></h2>
    <div class="panel-body" id="panelBody"></div>
  </section>

  <!-- Consola de voz -->
  <footer class="console">
    <p class="heard" id="heard"></p>
    <p class="reply" id="reply"></p>
    <button class="voice-bar" id="voiceBar" data-target>
      <span class="vb-dot" id="vbDot"></span>
      <span class="vb-state mono" id="vbState">VOZ</span>
      <canvas class="vb-wave" id="vbWave" width="240" height="40"></canvas>
      <span class="vb-hint" id="vbHint"></span>
    </button>
    <div class="nav mono" id="navLabel"></div>
  </footer>

  <!-- Modo reposo: pantalla apagada hasta oír «despierta» o dos aplausos -->
  <div class="sleep-screen" id="sleep">
    <div class="sleep-core"><i></i><i></i><i></i></div>
    <p class="sleep-title mono" id="sleepTitle">SISTEMA EN REPOSO</p>
    <p class="sleep-hint" id="sleepHint"></p>
    <button class="sleep-power mono" id="sleepPower" data-target>ENCENDER</button>
  </div>
  <div class="boot-scan" aria-hidden="true"></div>

  <!-- Reproductor de música flotante (Spotify) -->
  <div class="mini-player" id="miniPlayer" hidden>
    <div class="mp-head mono"><span>♫ SPOTIFY</span><button class="mp-close" id="mpClose" data-target aria-label="Cerrar">✕</button></div>
    <div id="spHost"></div>
  </div>

  <!-- Sensor óptico -->
  <div class="sensor off" id="sensor">
    <video id="video" playsinline muted></video>
    <canvas id="handCanvas"></canvas>
    <span class="sensor-label mono" id="sensorLabel">SENSOR</span>
    <button class="sensor-start mono" id="camStart" data-target hidden>ACTIVAR CÁMARA</button>
  </div>

  <!-- Cursor holográfico -->
  <div class="cursor" id="cursor" hidden>
    <svg viewBox="0 0 60 60">
      <circle class="c-ring" cx="30" cy="30" r="13"/>
      <circle class="c-dwell" cx="30" cy="30" r="21"/>
      <path class="c-ticks" d="M30 1v9M30 50v9M1 30h9M50 30h9"/>
      <circle class="c-dot" cx="30" cy="30" r="2.5"/>
    </svg>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
