<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>NIKOLAI Quant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500..800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/quant/app.css">
</head>
<body>
  <aside class="nav">
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" stroke="#79e3ff" stroke-width="2.6"><path d="M6 36 18 22l8 8 16-18"/><path d="M34 12h8v8" stroke="#ffcc5c"/></svg>
      <div><b>NIKOLAI</b><span>QUANT</span></div>
    </div>
    <nav id="tabs">
      <button data-tab="dash" class="on"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg><span>Panel</span></button>
      <button data-tab="bots"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4M9 13h.01M15 13h.01M9.5 16.5h5"/></svg><span>Bots</span></button>
      <button data-tab="ai"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 11l-5.5 2.5L12 19l-2.5-5.5L4 11l5.5-2.5z"/></svg><span>IA</span></button>
      <button data-tab="ex"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg><span>Exchanges</span></button>
      <button data-tab="mine"><svg viewBox="0 0 24 24"><path d="M14 4l6 6M4 20l9-9M11 6l7 7M15 3l6 6-3 1-4-4z"/></svg><span>Minería</span></button>
      <button data-tab="tools"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg><span>Herramientas</span></button>
    </nav>
    <button class="logout" id="logout"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Salir</span></button>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-l">
        <h1 id="title">Panel</h1>
        <span class="pill" id="runPill">0 bots activos</span>
        <span class="pill warn" id="sandboxPill" hidden>TESTNET</span>
      </div>
      <div class="top-r">
        <span class="mono clock" id="clock"></span>
        <button class="btn danger" id="panic" title="Detiene todos los bots y cierra todas sus posiciones">⏻ PÁNICO</button>
      </div>
    </header>
    <section id="view"></section>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/quant/app.js"></script>
</body>
</html>
